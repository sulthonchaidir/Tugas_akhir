<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>We-Park Settings</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a2b4c;
    }

    .navbar {
      background-color: #102b45;
      color: white;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .navbar h1 {
      margin: 0;
      font-size: 1.2rem;
    }

    .navbar-right {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .navbar-right a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 600px;
      margin: 60px auto;
      background-color: #2c3e50;
      border-radius: 12px;
      padding: 40px;
      color: white;
      text-align: center;
    }

    .settings-icon {
      font-size: 50px;
      margin-bottom: 20px;
    }

    .settings-btn {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      background-color: #1a2d40;
      border: none;
      border-radius: 8px;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .settings-btn:hover {
      background-color: #34495e;
    }

    .toggle {
      margin-top: 20px;
    }

    .toggle input {
      transform: scale(1.4);
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <h1><a href="/dashboard" style="color: white; text-decoration: none;">Welcome in We-Park Management</a></h1>
    <div class="navbar-right">
      <a href="/dashboard">See Park</a>
      <a href="/profile.html">Account</a>
    </div>
  </div>

  <div class="container">
    <div class="settings-icon">⚙️</div>
    <button class="settings-btn" onclick="location.href='/help_desks.html'">Help Desk</button>
    <button class="settings-btn" onclick="alert('Report clicked')">Report</button>
    <button class="settings-btn" onclick="logout()">Logout Account</button>
    
    <div class="toggle">
      <label>Notification</label>
      <input type="checkbox" id="notifToggle" onchange="toggleNotification()" />
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBnX14P0ykDrTApG8_gdpRO1ucHwoExrD4",
      authDomain: "we-park-a98ff.firebaseapp.com",
      projectId: "we-park-a98ff",
      storageBucket: "we-park-a98ff.appspot.com",
      messagingSenderId: "972441358033",
      appId: "1:972441358033:web:dfb91b9e38ef48cc7fbff0"
    };
    firebase.initializeApp(firebaseConfig);

    firebase.auth().onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "/login";
      }
    });

    function logout() {
      firebase.auth().signOut().then(() => {
        window.location.href = "/login";
      });
    }

    function toggleNotification() {
      const checked = document.getElementById('notifToggle').checked;
      alert("Notifikasi " + (checked ? "diaktifkan" : "dimatikan"));
      // Kamu bisa simpan preferensi ini ke Firestore jika mau
    }
  </script>
</body>
</html>
